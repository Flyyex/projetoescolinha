# Configuracao de deploy no Render.
# ATENCAO: defina os valores reais abaixo no painel do Render (Environment > Environment Variables),
# NAO commite segredos neste arquivo.
#
# PLANO: aqui esta 'free' so para o Blueprint criar. O free DORME depois de ~15 min
# sem uso e o Postgres free EXPIRA em 30 dias -- e o app depende do cron horario de
# gotejamento (server.js) para creditar rendimento. Troque para 'starter' os dois
# antes de usar de verdade, ou pelo painel depois de criar.
#
# CRM: services/crmDb.js ainda grava em crm_data.json, que fica no disco efimero do
# Render. Os leads somem a cada deploy. users/saldos NAO tem esse problema (vao para
# o Postgres). Ver README antes de usar o CRM em producao.
services:
  - type: web
    name: truckauto
    env: node
    plan: free
  buildCommand: npm ci
  startCommand: node server.js
  envVars:
      - key: NODE_ENV
        value: production
      # >>> Troque pelos SEUS valores no painel do Render (nunca commitar aqui) <<<
      - key: DATABASE_URL
        fromDatabase:
          name: truckauto-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: APP_URL
        sync: false
      # Dados da empresa (email, WhatsApp, dominio, razao social, CNPJ) NAO ficam
      # aqui: sao lidos de config/site.json, que e versionado. Editar aquele arquivo
      # e dar push ja publica. Use variavel SITE_* aqui so para sobrescrever sem
      # editar codigo.
      # Telegram (opcional - backup diario + avisos admin)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_TELEGRAM_CHAT_ID
        sync: false
      # Asaas - Cobranca Pix + Saques automaticos (https://www.asaas.com)
      - key: ASAAS_ENV
        value: production
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      # MisticPay - CashIn Pix + Saques automaticos (https://misticpay.com)
      - key: MISTIC_PK
        sync: false
      - key: MISTIC_SK
        sync: false
      # SyncPay - CashIn Pix (https://syncpayments.com.br)
      - key: SYNCPAY_CLIENT_ID
        sync: false
      - key: SYNCPAY_CLIENT_SECRET
        sync: false
      - key: SYNCPAY_WEBHOOK_TOKEN
        sync: false
      # Evolution API / WhatsApp (opcional - nao configurado por padrao)
      - key: EVOLUTION_API_URL
        sync: false
      - key: GLOBAL_API_KEY
        sync: false
      - key: DEFAULT_INSTANCE
        sync: false

databases:
  - name: truckauto-db
    plan: free
